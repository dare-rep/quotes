  <style>
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    html,body{
      width: 100%;
      height: 100%;
      background-image: linear-gradient(to left , blue,green);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrapper{
      width: 95%;
      max-width : 600px;
      height: 100%;
      background-color: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,.2);
      overflow-y: scroll;
      display: flex;
      justify-content: baseline;
      align-items: center;
      flex-direction: column;
      padding: 10px;
      gap: 5px;
    }

    .wrapper::-webkit-scrollbar{
      display : none;
      width: 5px;
      background-color: rgba(255,255,255,.5);
    }

    .wrapper::-webkit-scrollbar-track{
      background-color: rgba(255,255,255,.2);
    }

    .wrapper::-webkit-scrollbar-thumb{
      background-color: green;
    }

    .wrapper > .cards{
      width: 75%;
      min-width: 400px;
      max-width: 600px;
      aspect-ratio: 1/.7;
      background-color: rgba(255,255,255,.1);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(255,255,255,.2);
      font-size: clamp(16px,10vw,27px);
      opacity: .1;
      overflow: wrap;
      word-wrap: wrap;
      word-break: break-word;
      padding: 10px;
      position: relative;
      color: white;
    }

    .cards.chx{
      transition: 0.4s;
      opacity: 1;
    }

    .cards > .copy{
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 100px;
      aspect-ratio: 1/.5;
      background-color: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      color: white;
      font-size: clamp(15px,10vw,18px);
    }

    .cards > .save{
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 100px;
      aspect-ratio: 1/.5;
      background-color: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      color: white;
      font-size: clamp(15px,10vw,18px); 
    }

console.log(quotes.length)

      const observer = new IntersectionObserver((elements) => {
        elements.forEach(element => {
          if(element.isIntersecting){
            element.target.style.color = "red";
            element.target.classList.toggle('chx')
            console.log(element)
          }
        })
      } , {
        "root":wrapper,
        "threshold":0.2
      })
      
      console.log(observer)
      cards.forEach((card , pos) => {
        const copy = document.createElement('button');
        const download = document.createElement("button");
        download.textContent = "save";
        download.className = "save";
        copy.className = "copy";
        card.setAttribute("name" , quotes[pos])
        copy.textContent = "copy";
        card.textContent = card.getAttribute('name');
        observer.observe(card)
        

        card.addEventListener("click" , (e) => {
          if(e.target.className === "copy"){
            navigator.clipboard.writeText(card.getAttribute('name'));
          }

          if(e.target.className = "save"){
            copy.style.display = "none";
            download.style.display = "none";

            html2canvas(card)
            .then(chx => {
              const bin = chx.toDataURL("image/jpeg");
              return bin;
            })
            .then(data => {
              const link = document.createElement("a");
              link.href = data;
              link.download = card.getAttribute("name")[0] + "image.jpeg";
              link.click()
            })
             .then(show => {
               copy.style.display = "flex";
               download.style.display = "flex";
            })
          }
        })

        card.append(copy , download)
